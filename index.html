<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI Image Description Tester</title>

  <style>
    #spinner {
      display: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: #2563eb;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OpenAI Image Description Tester</h1>
    <div style="display: flex; flex-direction: column;">
      <label>
        <span>Add your OpenAI Key here</span>
        <input id="apiKey" type="text" placeholder="sk...">
      </label>

      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>
    <br>
    <button id="describeBtn" onclick="console.log('analyzing images...');" disabled>Describe Images</button>
    <div
    style="
      display: grid;
      grid-template-columns: repeat(2, 200px);
    "
    id="preview-container"
    ></div>

    <div id="result"></div>
    <div id="spinner"></div>
  </div>
  <script src="script-openai-promises.js"></script>
</body>
</html>
