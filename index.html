<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester</title>
</head>
<body>
  <div class="container">
    <h1>Simple Test Description Tester</h1>

    <div class="all-sections">
      <section class="simple-test">
        <h2>Synchronous Request</h2>
        <div>
          <label>
            <span>Choose a number</span>
            <input type="number" name="" id="number">
          </label>
        </div>

        <div
          style="
          display: flex;
          gap: 12px;
        "
        >
          <button id="syncBtn" onclick="console.log('adding wish...');" disabled>Add number (Synchronous)</button>
        </div>

        <div
        style="
          display: grid;
          grid-template-columns: repeat(2, 200px);
        "
        id="preview-container-test"
        ></div>

        <div class="results"></div>
      </section>
    </div>
  </div>

  <script src="sync-script-simple-test.js"></script>
</body>
</html>
