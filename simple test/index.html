<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI Image Description Tester</title>

  <style>
    #wish {
      width: 40%;
    }
    #spinner {
      display: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: #2563eb;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #asyncBtn {
      background-color: #a5d8ff;
      border: 2px solid #97cef8;
      padding: 8px;
      border-radius: 4px;
    }
    #syncBtn {
      background-color: #ffec99;
      border: 2px solid #f7e17f;
      padding: 8px;
      border-radius: 4px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple Image Description Tester</h1>
    <label>
      <span>Make a Wish (they can be true)</span>
      <input id="wish" type="text" placeholder="add wishes separated by comma, ex.: go see sister, go to the club, go sing">
    </label>
    <br>
    <div
      style="
      display: flex;
      gap: 12px;
    "
    >
      <button id="asyncBtn" onclick="console.log('adding wish...');" disabled>Add a Wish (Asynchronous)</button>
      <button id="syncBtn" onclick="console.log('adding wish...');" disabled>Add a Wish (Synchronous)</button>
    </div>
    <div
    style="
      display: grid;
      grid-template-columns: repeat(2, 200px);
    "
    id="preview-container"
    ></div>

    <span id="totalTime"></span>

    <div id="spinner"></div>
  </div>
  <script src="script-simple-test.js"></script>
</body>
</html>
